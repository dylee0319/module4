<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모듈 4 영어 길잡이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 한 단 880px. 위에는 차시 탭, 본문은 '지금 할 일 → 활동 카드 → 참고와 도구' 순서. 강조는 줄을 긋지 않고 색과 굵기, 테두리의 대비로 한다. 지운 말·넣은 말 표시는 학생이 실제로 고친 문장에만 쓴다. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#e9edf4; --ink:#14213d; --muted:#5a667c; --line:#d5dbe6;
  --accent:#2a55d9; --accent-ink:#ffffff; --accent-soft:#e4ebff;
  --mark:#d93a45; --ok:#16855a; --ok-soft:#dff3ea; --warn:#a15c00; --warn-soft:#fdeed3;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.06);
  --text:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131d; --surface:#171d2b; --sunk:#111725; --ink:#e9edf6; --muted:#9ba7bd; --line:#2a3347;
  --accent:#8aa6ff; --accent-ink:#0e131d; --accent-soft:#1f2a4a;
  --mark:#ff7f86; --ok:#57c995; --ok-soft:#16302a; --warn:#f0b35a; --warn-soft:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131d; --surface:#171d2b; --sunk:#111725; --ink:#e9edf6; --muted:#9ba7bd; --line:#2a3347;
  --accent:#8aa6ff; --accent-ink:#0e131d; --accent-soft:#1f2a4a;
  --mark:#ff7f86; --ok:#57c995; --ok-soft:#16302a; --warn:#f0b35a; --warn-soft:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 머리띠 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:.8rem}
.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;margin-left:auto;scrollbar-width:none;padding-block:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:.93rem}
.tab:hover{background:var(--sunk);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--surface)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mark);margin-left:6px;vertical-align:middle}

main{padding-block:28px 120px}
.view{display:flex;flex-direction:column;gap:20px}

/* 첫 화면 */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:8px 4px}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;color:var(--muted)}
.hero h1{font-size:clamp(1.7rem,5.2vw,2.6rem);font-weight:700;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--accent);white-space:nowrap;padding:0 .08em;border-radius:4px;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 20%,transparent) 62%)}
.shift{display:grid;grid-template-columns:minmax(0,.85fr) auto minmax(0,1.25fr);gap:12px;align-items:stretch;margin-top:4px}
.shift > div{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.shift .lab{display:flex;align-items:center;gap:8px}
.shift .from{border:1px dashed var(--line);color:var(--muted)}
.shift .from b{font-weight:600;font-size:1rem}
.shift .to{border:2px solid var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.shift .to .lab{color:var(--accent)}
.shift .to b{font-size:1.14rem;letter-spacing:-.012em;line-height:1.4}
.shift small{font-size:.87rem}
.shift .to small{color:var(--muted)}
.shift .ar{align-self:center;color:var(--accent);font-size:1.5rem;font-weight:700;line-height:1}
.shift .chip0{font-family:var(--text);font-size:.72rem;font-weight:700;letter-spacing:0;padding:1px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
@media (max-width:640px){.shift{grid-template-columns:1fr}.shift .ar{justify-self:center;transform:rotate(90deg)}}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.flow button{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.flow button:hover{border-color:var(--ink)}
.flow .k{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow b{font-size:.97rem;line-height:1.45}
.flow .o{margin-top:auto;border-top:1px dashed var(--line);padding-top:8px;font-size:.84rem;color:var(--muted)}
.flow .o i{font-style:normal;display:block;font-family:var(--mono);font-size:.74rem;letter-spacing:.03em}
.flow button:not(:last-child)::after{content:"→";position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:.95rem}
.flow button.core{border:2px solid var(--accent);background:var(--accent-soft)}
.flow button.core .k{color:var(--accent)}
@media (max-width:760px){.flow{grid-template-columns:1fr 1fr;gap:10px}.flow button:not(:last-child)::after{content:none}}
@media (max-width:420px){.flow{grid-template-columns:1fr}}
.dim{color:var(--muted)}
.hero p{color:var(--muted);max-width:60ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:1.12rem}
.card h3{font-size:1rem}
.sub{color:var(--muted);font-size:.92rem}

.now{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.now-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--accent);color:var(--accent-ink)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
.pill.k-group{background:var(--warn-soft);color:var(--warn)}
.pill.k-solo{background:var(--accent-soft);color:var(--accent)}
.pill.k-talk{background:var(--sunk);color:var(--muted)}
.pill.k-pair{background:var(--ok-soft);color:var(--ok)}
@keyframes pulse{50%{opacity:.35}}
.now h2{font-size:1.35rem;letter-spacing:-.01em}
.now .left{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;margin-left:auto}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .6s}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:.93rem;cursor:pointer;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:var(--sunk)}
.btn.small{min-height:34px;padding:5px 10px;font-size:.84rem}

/* 하루 일정 */
.day{display:grid;gap:14px}
.sess{display:grid;grid-template-columns:86px 1fr;gap:4px 16px;align-items:start}
.sess-h{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sess-h button{border:0;background:none;padding:0;font-weight:700;font-size:1rem;cursor:pointer;color:var(--ink);text-align:left}
.sess-h button:hover{color:var(--accent)}
.sess-h span{color:var(--muted);font-size:.86rem}
.seg{display:contents}
.seg time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted);padding-top:3px}
.seg div{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding-block:2px}
.seg.past time,.seg.past div{opacity:.5}
.seg.cur div b{color:var(--accent)}
.seg.cur time{color:var(--accent);font-weight:600}
.seg small{color:var(--muted)}
.gapline{grid-column:1/-1;color:var(--muted);font-size:.84rem;font-family:var(--mono);padding:2px 0 0}

/* 체크 목록 */
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.checks label{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;cursor:pointer}
.checks label:hover{background:var(--sunk)}
.checks input{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:7px;margin:2px 0 0;display:grid;place-content:center;background:var(--surface);cursor:pointer;flex:none}
.checks input::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.checks input:checked{background:var(--ok);border-color:var(--ok)}
.checks input:checked::after{opacity:1}
.checks input:checked + span{color:var(--muted)}
.checks .n{font-family:var(--mono);color:var(--muted);font-size:.82rem;margin-right:6px}
.checks small{display:block;color:var(--muted)}

/* 차시 화면 */
.s-head{display:flex;flex-direction:column;gap:8px}
.s-head h1{font-size:clamp(1.4rem,4.4vw,1.9rem);letter-spacing:-.02em}
.q{border-left:4px solid var(--mark);padding:6px 0 6px 14px;font-size:1.06rem;font-weight:600}
.act-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.act-meta time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--muted)}
.act.is-now{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;border-top:1px dashed var(--line);padding-top:12px}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.92rem;color:var(--muted)}
.talk{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.93rem}
.talk time{font-family:var(--mono);font-size:.86rem}

h2.sec{font-size:.86rem;font-family:var(--mono);letter-spacing:.05em;color:var(--muted);font-weight:600;margin-top:12px}
details.card{padding:0;gap:0}
details.card > summary{list-style:none;cursor:pointer;padding:16px 20px;font-weight:600;display:flex;align-items:center;gap:10px}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none}
details.card[open] > summary::after{transform:rotate(-135deg)}
details.card > summary .tag{font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
details.card > .body{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}

.tbl{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.rev del{color:var(--muted);text-decoration-color:var(--mark)}
.rev ins{text-decoration:none;border-bottom:2px solid var(--mark)}
.code{font-family:var(--mono);font-size:.84rem;color:var(--accent);white-space:nowrap}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mini b{font-size:.95rem}
.mini span{color:var(--muted);font-size:.9rem}
.mini.no{border-style:dashed;background:var(--sunk)}
.mini.no b{color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.std{display:grid;gap:8px}
.std > div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:.86rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.out{font-family:var(--mono);font-size:.9rem;background:var(--sunk);border-radius:12px;padding:14px;white-space:pre-wrap;min-height:54px}
.big{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.big b{color:var(--accent);font-family:var(--mono)}
.said{font-size:.86rem;color:var(--ok);font-weight:600;min-height:1.4em}

.crit{display:grid;gap:8px}
.crit > div{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crit > div:last-child{border-bottom:0}
.crit small{display:block;color:var(--muted)}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg3 button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:700;min-width:42px}
.seg3 button + button{border-left:1px solid var(--line)}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.meter{display:grid;gap:10px}
.meter > div{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.meter .bar{height:10px}
.meter .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.meter .b2 i{background:var(--ok)}

.essays{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.essay{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;word-break:normal}
.essay .tagAB{font-family:var(--mono);font-weight:600;font-size:.86rem;color:var(--muted)}
.essay h3{font-size:1rem}
.essay p{line-height:1.7;font-size:.97rem}
.essay.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.prog{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--muted);font-family:var(--mono)}
.prog .bar{flex:1;max-width:220px}
.prog .bar i{background:var(--ok)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.strip span{font-size:.76rem;font-family:var(--mono);color:var(--muted);border-top:4px solid var(--sunk);padding-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip span.d{border-top-color:var(--ok)}
.strip span.c{border-top-color:var(--accent);color:var(--accent);font-weight:600}
.typ{display:grid;gap:10px}
.typ dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:.95rem}
.typ dt{color:var(--muted);white-space:nowrap}
.typ dd{margin:0}
.typ ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.93rem}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink);word-break:normal}
.lab{font-size:.8rem;font-weight:600;color:var(--muted);font-family:var(--mono);letter-spacing:.03em}
.then{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.act details.card{box-shadow:none;background:var(--bg);border-radius:12px}
.act details.card > summary{padding:12px 14px;font-size:.95rem}
.act details.card > .body{padding:0 14px 14px}
.slot{display:flex;flex-direction:column;gap:8px}
.slot:empty{display:none}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
/* 앞 화면용 크게 보기 */
.stage{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--ink);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.stage .in{max-width:1500px;margin:0 auto;min-height:100%;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto;gap:clamp(14px,2.4vw,36px) clamp(20px,4vw,64px)}
.stage header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.stage header .meta{font-family:var(--mono);color:var(--muted);font-size:clamp(.9rem,1.4vw,1.2rem)}
.stage header .sp{margin-left:auto;display:flex;gap:8px}
.stage h1{grid-column:1/-1;font-size:clamp(1.8rem,4.2vw,3.6rem);letter-spacing:-.02em;margin-top:-.2em}
.stage ol{margin:0;padding:0;list-style:none;display:grid;gap:clamp(12px,1.8vw,24px);align-content:start;counter-reset:st}
.stage ol li{counter-increment:st;display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,1.4vw,20px);font-size:clamp(1.15rem,2.1vw,1.9rem);line-height:1.45}
.stage ol li::before{content:counter(st);font-family:var(--mono);font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-content:center;font-size:.8em}
.stage .clock{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.6vw,22px);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(16px,2.4vw,36px);align-self:start}
.stage .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(4rem,11vw,10rem);line-height:1;letter-spacing:-.03em}
.stage .clock.done{background:var(--mark);border-color:var(--mark);color:#fff}
.stage .clock .row{justify-content:center}
.stage .clock .lbl{font-size:clamp(.95rem,1.4vw,1.25rem);color:inherit;opacity:.8;text-align:center}
.stage footer{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 28px;font-size:clamp(.95rem,1.5vw,1.3rem);color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
